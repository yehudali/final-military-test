services:
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.8.0
    

    ports:
      - "9092:9092"

    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092 #kafka!
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs


    volumes:
      - kafka_kraft:/var/lib/kafka/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "xpack.security.enabled: false"
    ports:
      - 9200:9200

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/datafile

    healthcheck:
      test: ["CMD", "CURL", "-f", "http://localhost:9200/_cluster/health"]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.9
    container_name: kibana
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://localhost:9200  # http://elasticsearch:9200
    depends_on:
      - elasticsearch
        
        
        

volumes:
  kafka_kraft:
  elasticsearch-data:

      
  

    
